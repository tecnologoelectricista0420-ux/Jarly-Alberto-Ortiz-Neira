<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Permisos Operativos Regional Aguachica</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .login-logo {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        .login-card h1 {
            text-align: center;
            margin: 0;
            font-size: 24px;
        }

        .login-card p {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
        }

        .topbar {
            min-height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-title {
            font-size: 20px;
            font-weight: bold;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .btn-logout {
            background: #334155;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: #475569;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }

        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            border-left: 5px solid;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        .stat-planeado {
            border-color: #2196f3;
        }

        .stat-solicitado {
            border-color: #eab308;
        }

        .stat-aprobado {
            border-color: #9333ea;
        }

        .stat-ejecutado {
            border-color: #16a34a;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .toolbar input,
        .toolbar select {
            flex: 1;
            min-width: 200px;
        }

        /* =========================
           INPUTS
        ========================= */

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        button {
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        /* =========================
           CALENDARIO
        ========================= */

        .calendar-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .calendar-header h2 {
            margin: 0;
            text-transform: capitalize;
        }

        .calendar-buttons {
            display: flex;
            gap: 6px;
        }

        .calendar-buttons button {
            border: none;
            background: #e2e8f0;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid #e2e8f0;
            border-left: 1px solid #e2e8f0;
        }

        .weekday {
            background: #f8fafc;
            font-weight: bold;
            text-align: center;
            padding: 10px 5px;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .day {
            min-height: 125px;
            padding: 6px;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }

        .day-number {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .today {
            background: #eff6ff;
        }

        /* =========================
           FESTIVOS COLOMBIA
        ========================= */

        .holiday-day {
            background: #fff7ed !important;
        }

        .holiday-name {
            background: #f97316;
            color: white;
            padding: 4px 6px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* =========================
           EVENTOS / PERMISOS
        ========================= */

        .event {
            color: white;
            padding: 5px 7px;
            border-radius: 5px;
            font-size: 11px;
            margin-bottom: 4px;
            cursor: pointer;
            overflow: hidden;
        }

        .event:hover {
            opacity: .85;
        }

        .estado-PLANEADO {
            background: #2196f3;
        }

        .estado-SOLICITADO {
            background: #eab308;
            color: #111827;
        }

        .estado-APROBADO {
            background: #9333ea;
        }

        .estado-EJECUTADO {
            background: #16a34a;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.65);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: #e2e8f0;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions-right {
            display: flex;
            gap: 10px;
        }

        /* =========================
           MENSAJES
        ========================= */

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message-success {
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
           LEYENDA
        ========================= */

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .legend-holiday {
            background: #f97316;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 900px) {

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

            .day {
                min-height: 100px;
            }
        }

        @media(max-width: 650px) {

            .topbar {
                height: auto;
                padding: 15px;
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .container {
                padding: 10px;
            }

            .dashboard {
                grid-template-columns: 1fr 1fr;
            }

            .calendar {
                min-width: 750px;
            }

            .calendar-wrapper {
                overflow-x: auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions-right {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

    <div class="login-card">

        <div class="login-logo">
            ⚡
        </div>

        <h1>
            Permisos Operativos
        </h1>

        <p>
            Regional Aguachica
        </p>

        <div class="form-group">

            <label>
                Correo electrónico
            </label>

            <input
                type="email"

        </div>

        <div class="form-group">

            <label>
                Contraseña
            </label>

        </div>

        <button

            style="width:100%"

        >
            🔐 Ingresar
        </button>

        <div

    </div>

</div>


<!-- =====================================================
     APLICACIÓN
===================================================== -->

<div id="app">

    <div class="topbar">

        <div class="topbar-title">
            ⚡ PLANIFICADOR DE PERMISOS OPERATIVOS
        </div>

        <div class="topbar-user">

            <span id="currentUser"></span>

            <button
                class="btn-logout"
                onclick="logout()"
            >
                Salir
            </button>

        </div>

    </div>


    <div class="container">


        <!-- =========================
             INDICADORES
        ========================= -->

        <div class="dashboard">

            <div class="stat-card stat-planeado">

                <h3>
                    🔵 PLANEADOS
                </h3>

                <div
                    class="stat-number"
                    id="countPlaneado"

                    0
                </div>

            </div>


            <div class="stat-card stat-solicitado">

                <h3>
                    🟡 SOLICITADOS
                </h3>

                <div
                    class="stat-number"
                    id="countSolicitado"
                >
                    0
                </div>

            </div>


            <div class="stat-card stat-aprobado">

                <h3>
                    🟣 APROBADOS
                </h3>

                <div
                    class="stat-number"
                    id="countAprobado"
                >
                    0
                </div>

            </div>


            <div class="stat-card stat-ejecutado">

                <h3>
                    🟢 EJECUTADOS
                </h3>

                <div
                    class="stat-number"
                    id="countEjecutado"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             FILTROS
        ========================= -->

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Buscar PO, actividad, municipio, alimentador..."
                oninput="renderCalendar()"
            >

            <select
                id="filterEstado"
                onchange="renderCalendar()"
            >

                <option value="">
                    Todos los estados
                </option>

                <option value="PLANEADO">
                    🔵 Planeado
                </option>

                <option value="SOLICITADO">

                </option>

                <option value="APROBADO">
                    🟣 Aprobado
                </option>

                <option value="EJECUTADO">

                </option>

            <button

            </button>

        </div>


        <!-- =========================

        ========================= -->

        <div class="calendar-card">

                    <button onclick="nextMonth()">

            </div>


            <div class="calendar-wrapper">

                <div

                ></div>

            <!-- LEYENDA -->

            <div class="legend">

                <div class="legend-item">
                    <span

                </div>

                <div class="legend-item">
                    <span
                        class="legend-color"

                    Solicitado

                <div class="legend-item">
                    <span
                        class="legend-color"
                        style="background:#9333ea"
                    ></span>

                </div>

                <div class="legend-item">
                    <span

                <div class="legend-item">
                    <span

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL PERMISO
===================================================== -->

>

<script>


/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lhdbpwaxzthumsflvmkm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_86bRK3rezZLTS7B7AVOv-g_hlT_XAiE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let permisos = [];

let currentDate = new Date();

let editingId = null;


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!email || !password) {

        showLoginMessage(
            "Ingrese correo y contraseña."
        );

        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            showLoginMessage(
                "No fue posible iniciar sesión: " +
                error.message
            );

            return;
        }


        showApplication(
            data.user
        );


    } catch (error) {

        showLoginMessage(
            "Error de conexión con Supabase: " +
            error.message
        );

    }

}


/* =====================================================
   MOSTRAR APLICACIÓN
===================================================== */

function showApplication(user) {

    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("app")
        .style.display = "block";


    document
        .getElementById("currentUser")
        .textContent =
        user.email;


    loadPermissions();

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

async function logout() {

    await supabaseClient
        .auth
        .signOut();

    location.reload();

}


/* =====================================================
   MENSAJE LOGIN
===================================================== */

function showLoginMessage(message) {

    const box =
        document.getElementById(
            "loginMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";

}


/* =====================================================
   CARGAR PERMISOS
===================================================== */

async function loadPermissions() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("permisos")
            .select("*")
            .order(
                "fecha_ejecucion",
                {
                    ascending: true
                }
            );


    if (error) {

        alert(
            "Error cargando permisos:\n\n" +
            error.message
        );

        return;
    }


    permisos =
        data || [];


    updateDashboard();

    renderCalendar();

}


/* =====================================================
   INDICADORES
===================================================== */

function updateDashboard() {

    document
        .getElementById("countPlaneado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "PLANEADO"
        ).length;


    document
        .getElementById("countSolicitado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "SOLICITADO"
        ).length;


    document
        .getElementById("countAprobado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "APROBADO"
        ).length;


    document
        .getElementById("countEjecutado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "EJECUTADO"
        ).length;

}


/* =====================================================
   FESTIVOS DE COLOMBIA
===================================================== */

/*
    Calcula la fecha de Pascua.
*/

function calcularPascua(year) {

    const a = year % 19;

    const b = Math.floor(year / 100);

    const c = year % 100;

    const d = Math.floor(b / 4);

    const e = b % 4;

    const f = Math.floor(
        (b + 8) / 25
    );

    const g = Math.floor(
        (b - f + 1) / 3
    );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(c / 4);

    const k =
        c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11 * h + 22 * l) /
            451
        );

    const month =
        Math.floor(
            (h + l - 7 * m + 114) /
            31
        );

    const day =
        (
            (h + l - 7 * m + 114) %
            31
        ) + 1;


    return new Date(
        year,
        month - 1,
        day
    );

}


/*
    Mueve un festivo colombiano
    al lunes siguiente cuando
    corresponde a la Ley Emiliani.
*/

function siguienteLunes(date) {

    const result =
        new Date(date);

    const day =
        result.getDay();


    if (day === 0) {

        result.setDate(
            result.getDate() + 1
        );

    } else if (day !== 1) {

        result.setDate(
            result.getDate() +
            (8 - day)
        );

    }


    return result;

}


/*
    Festivos nacionales de Colombia.
*/

function getColombianHolidays(year) {

    const holidays = {};


    function add(date, name) {

        const key =
            formatDate(date);

        holidays[key] =
            name;

    }


    function fixed(
        month,
        day,
        name
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );


        /*
            Estos festivos se trasladan
            al lunes según Ley Emiliani.
        */

        const monday =
            siguienteLunes(date);


        if (
            date.getDay() === 1
        ) {

            add(
                date,
                name
            );

        } else {

            add(
                monday,
                name
            );

        }

    }


    /*
        Festivos fijos que NO se trasladan.
    */

    add(
        new Date(
            year,
            0,
            1
        ),
        "Año Nuevo"
    );


    add(
        new Date(
            year,
            4,
            1
        ),
        "Día del Trabajo"
    );


    add(
        new Date(
            year,
            6,
            20
        ),
        "Independencia de Colombia"
    );


    add(
        new Date(
            year,
            7,
            7
        ),
        "Batalla de Boyacá"
    );


    add(
        new Date(
            year,
            11,
            8
        ),
        "Inmaculada Concepción"
    );


    add(
        new Date(
            year,
            11,
            25
        ),
        "Navidad"
    );


    /*
        Festivos trasladables.
    */

    fixed(
        1,
        6,
        "Día de los Reyes Magos"
    );


    fixed(
        3,
        19,
        "Día de San José"
    );


    fixed(
        6,
        29,
        "San Pedro y San Pablo"
    );


    fixed(
        8,
        15,
        "Asunción de la Virgen"
    );


    fixed(
        10,
        12,
        "Día de la Raza"
    );


    fixed(
        11,
        1,
        "Todos los Santos"
    );


    fixed(
        11,
        11,
        "Independencia de Cartagena"
    );


    /*
        Semana Santa.
    */

    const easter =
        calcularPascua(year);


    const juevesSanto =
        new Date(easter);

    juevesSanto.setDate(
        easter.getDate() - 3
    );


    const viernesSanto =
        new Date(easter);

    viernesSanto.setDate(
        easter.getDate() - 2
    );


    add(
        juevesSanto,
        "Jueves Santo"
    );


    add(
        viernesSanto,
        "Viernes Santo"
    );


    /*
        Ascensión del Señor:
        43 días después de Pascua,
        trasladado al lunes.
    */

    const ascension =
        new Date(easter);

    ascension.setDate(
        easter.getDate() + 43
    );


    add(
        siguienteLunes(ascension),
        "Ascensión del Señor"
    );


    /*
        Corpus Christi:
        64 días después de Pascua.
    */

    const corpus =
        new Date(easter);

    corpus.setDate(
        easter.getDate() + 64
    );


    add(
        siguienteLunes(corpus),
        "Corpus Christi"
    );


    /*
        Sagrado Corazón:
        71 días después de Pascua.
    */

    const sagradoCorazon =
        new Date(easter);

    sagradoCorazon.setDate(
        easter.getDate() + 71
    );


    add(
        siguienteLunes(
            sagradoCorazon
        ),
        "Sagrado Corazón de Jesús"
    );


    return holidays;

}


/* =====================================================
   CALENDARIO
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    const monthName =
        currentDate.toLocaleDateString(
            "es-CO",
            {
                month: "long",
                year: "numeric"
            }
        );


    document
        .getElementById("monthTitle")
        .textContent =
        monthName;


    const holidays =
        getColombianHolidays(
            year
        );


    const weekdays = [
        "LUN",
        "MAR",
        "MIÉ",
        "JUE",
        "VIE",
        "SÁB",
        "DOM"
    ];


    weekdays.forEach(
        dayName => {

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "weekday";

            header.textContent =
                dayName;

            calendar.appendChild(
                header
            );

        }
    );


    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    /*
        Convertir domingo = 0
        a lunes = 0
    */

    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /*
        Espacios antes del
        primer día del mes.
    */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day";

        calendar.appendChild(
            empty
        );

    }


    /*
        Crear días.
    */

    for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
    ) {

        const day =
            document.createElement(
                "div"
            );


        day.className =
            "day";


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const dateString =
            formatDate(date);


        const today =
            formatDate(
                new Date()
            );


        if (
            dateString === today
        ) {

            day.classList.add(
                "today"
            );

        }


        /*
            Número del día.
        */

        const number =
            document.createElement(
                "div"
            );

        number.className =
            "day-number";

        number.textContent =
            dayNumber;

        day.appendChild(
            number
        );


        /*
            FESTIVO
        */

        if (
            holidays[dateString]
        ) {

            day.classList.add(
                "holiday-day"
            );


            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "holiday-name";


            holiday.textContent =
                "🇨🇴 " +
                holidays[dateString];


            holiday.title =
                "Día festivo de Colombia";


            day.appendChild(
                holiday
            );

        }


        /*
            PERMISOS
        */

        const events =
            getFilteredPermissions()
                .filter(
                    permission =>
                        permission
                            .fecha_ejecucion ===
                        dateString
                );


        events.forEach(
            permission => {

                const event =
                    document.createElement(
                        "div"
                    );


                event.className =
                    "event estado-" +
                    permission.estado;


                event.innerHTML =
                    "<strong>PO " +
                    escapeHtml(
                        permission.numero_po || ""
                    ) +
                    "</strong><br>" +
                    escapeHtml(
                        permission.actividad || ""
                    );


                event.title =
                    "Haz clic para editar";


                event.onclick =
                    () => {

                        openEditPermission(
                            permission
                        );

                    };


                day.appendChild(
                    event
                );

            }
        );


        calendar.appendChild(
            day
        );

    }

}


/* =====================================================
   FILTROS
===================================================== */

function getFilteredPermissions() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const estado =
        document
            .getElementById(
                "filterEstado"
            )
            .value;


    return permisos.filter(
        permission => {

            const text = [

                permission.numero_po,

                permission.actividad,

                permission.municipio,

                permission.zona,

                permission.alimentador,

                permission.cto,

                permission.responsable,

                permission.contratista,

                permission.planeador

            ]
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                text.includes(
                    search
                );


            const matchesEstado =
                !estado ||
                permission.estado ===
                estado;


            return (
                matchesSearch &&
                matchesEstado
            );

        }
    );

}

/* =====================================================
   GUARDAR PERMISO
===================================================== */

async function savePermission() {

    const data = {

        numero_po:
            getValue(
                "numero_po"
            ),

        actividad:
            getValue(
                "actividad"
            ),

        fecha_ejecucion:
            getValue(
                "fecha_ejecucion"
            ) || null,

        hora_inicio:
            getValue(
                "hora_inicio"
            ) || null,

        hora_fin:
            getValue(
                "hora_fin"
            ) || null,

        municipio:
            getValue(
                "municipio"
            ),

        zona:
            getValue(
                "zona"
            ),

        alimentador:
            getValue(
                "alimentador"
            ),

        cto:
            getValue(
                "cto"
            ),

        responsable:
            getValue(
                "responsable"
            ),

        contratista:
            getValue(
                "contratista"
            ),

        planeador:
            getValue(
                "planeador"
            ),

        estado:
            getValue(
                "estado"
            ),

        fecha_solicitud:
            getValue(
                "fecha_solicitud"
            ) || null,

        fecha_aprobacion:
            getValue(
                "fecha_aprobacion"
            ) || null,

        fecha_ejecucion_real:
            getValue(
                "fecha_ejecucion_real"
            ) || null,

        observaciones:
            getValue(
                "observaciones"
            )

    };


    if (
        !data.actividad
    ) {

        showFormMessage(
            "La actividad es obligatoria.",
            false
        );

        return;
    }


    let result;


    /*
        EDITAR
    */

    if (editingId) {

        result =
            await supabaseClient
                .from("permisos")
                .update(data)
                .eq(
                    "id",
                    editingId
                );

    }

    /*
        NUEVO
    */

    else {

        result =
            await supabaseClient
                .from("permisos")
                .insert([
                    data
                ]);

    }


    if (
        result.error
    ) {

        showFormMessage(
            "Error guardando el permiso: " +
            result.error.message,
            false
        );

        return;
    }


    showFormMessage(
        editingId
            ? "Permiso actualizado correctamente."
            : "Permiso creado correctamente.",
        true
    );


    await loadPermissions();


    setTimeout(
        () => {

            closeModal();

        },
        700
    );

}


/* =====================================================
   ELIMINAR PERMISO
===================================================== */

async function deletePermission() {

    if (!editingId) {

        return;

    }


    /*
        Buscar permiso actual.
    */

    const permission =
        permisos.find(
            p =>
                p.id ===
                editingId
        );


    const numeroPO =
        permission &&
        permission.numero_po
            ? permission.numero_po
            : editingId;


    const confirmar =
        confirm(
            "¿Está seguro de eliminar el permiso PO " +
            numeroPO +
            "?\n\n" +
            "Esta acción no se puede deshacer."
        );


    if (!confirmar) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("permisos")
            .delete()
            .eq(
                "id",
                editingId
            );


    if (error) {

        showFormMessage(
            "No fue posible eliminar el permiso: " +
            error.message,
            false
        );

        return;

    }


    showFormMessage(
        "Permiso eliminado correctamente.",
        true
    );


    editingId = null;


    await loadPermissions();


    setTimeout(
        () => {

            closeModal();

        },
        700
    );

}

        currentDate.getMonth() + 1
    );

/* =====================================================
   FUNCIONES AUXILIARES
===================================================== */

function getValue(id) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {

        return "";

    }


    return element.value
        .trim();

}


function setValue(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.value =
            value || "";

    }

}


function formatDate(
    date
) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   COMPROBAR SESIÓN
===================================================== */

async function checkSession() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(
            "Error comprobando sesión:",
            error.message
        );

        return;

    }


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        showApplication(
            data.session.user
        );

    }

}


/* =====================================================
   CAMBIOS DE SESIÓN
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        (
            event,
            session
        ) => {

            if (
                event ===
                "SIGNED_IN" &&
                session &&
                session.user
            ) {

                showApplication(
                    session.user
                );

            }

        }
    );


/* =====================================================
   ACTUALIZACIÓN EN TIEMPO REAL
===================================================== */

supabaseClient

    .channel(
        "permisos-realtime"
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "permisos"
        },
        () => {

            loadPermissions();

        }
    )

    .subscribe();


/* =====================================================
   INICIAR
===================================================== */

checkSession();


</script>
