<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Permisos Operativos Regional Aguachica</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .login-logo {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        .login-card h1 {
            text-align: center;
            margin: 0;
            font-size: 24px;
        }

        .login-card p {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
        }

        .topbar {
            height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-title {
            font-size: 20px;
            font-weight: bold;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .btn-logout {
            background: #334155;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }

        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            border-left: 5px solid;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        .stat-planeado {
            border-color: #2196f3;
        }

        .stat-solicitado {
            border-color: #eab308;
        }

        .stat-aprobado {
            border-color: #9333ea;
        }

        .stat-ejecutado {
            border-color: #16a34a;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .toolbar input,
        .toolbar select {
            flex: 1;
            min-width: 200px;
        }

        /* =========================
           INPUTS
        ========================= */

        input,
        select,
        textarea {

            width: 100%;
            padding: 11px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 14px;

            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        button {
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
        }

        /* =========================
           CALENDAR
        ========================= */

        .calendar-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .calendar-header h2 {
            margin: 0;
            text-transform: capitalize;
        }

        .calendar-buttons {
            display: flex;
            gap: 6px;
        }

        .calendar-buttons button {
            border: none;
            background: #e2e8f0;
            padding: 8px 12px;
            border-radius: 7px;
            font-weight: bold;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid #e2e8f0;
            border-left: 1px solid #e2e8f0;
        }

        .weekday {
            background: #f8fafc;
            font-weight: bold;
            text-align: center;
            padding: 10px 5px;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .day {
            min-height: 125px;
            padding: 6px;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }

        .day-number {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .today {
            background: #eff6ff;
        }

        .event {
            color: white;
            padding: 5px 7px;
            border-radius: 5px;
            font-size: 11px;
            margin-bottom: 4px;
            cursor: pointer;
            overflow: hidden;
        }

        .event:hover {
            opacity: .85;
        }

        /* COLORES */

        .estado-PLANEADO {
            background: #2196f3;
        }

        .estado-SOLICITADO {
            background: #eab308;
            color: #111827;
        }

        .estado-APROBADO {
            background: #9333ea;
        }

        .estado-EJECUTADO {
            background: #16a34a;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.65);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: #e2e8f0;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* =========================
           MENSAJES
        ========================= */

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message-success {
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 900px) {

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

            .day {

            }

        }

        @media(max-width: 650px) {

            .topbar {
                height: auto;
                padding: 15px;
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

                padding: 10px;
            }

            .dashboard {
                grid-template-columns: 1fr 1fr;
            }

            .calendar {
                min-width: 750px;
            }

            .calendar-wrapper {
                overflow-x: auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>

</head>

<script>


/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://hdbpwaxzthumsflvmkm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_86bRK3rezZLTS7B7AVOv-g_hlT_XAiE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let permisos = [];

let currentDate = new Date();

let editingId = null;


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        showLoginMessage(
            "Ingrese correo y contraseña."
        );

        return;
    }


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        showLoginMessage(
            "No fue posible iniciar sesión: " +
            error.message
        );

        return;
    }


    showApplication(data.user);

}


/* =====================================================
   MOSTRAR APLICACIÓN
===================================================== */

function showApplication(user) {

    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("app")
        .style.display = "block";


    document
        .getElementById("currentUser")
        .textContent =
        user.email;


    loadPermissions();

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =====================================================
   MENSAJE LOGIN
===================================================== */

function showLoginMessage(message) {

    const box =
        document.getElementById("loginMessage");


    box.textContent = message;

    box.style.display = "block";

}


/* =====================================================
   CARGAR PERMISOS
===================================================== */

async function loadPermissions() {

    const { data, error } =
        await supabaseClient
            .from("permisos")
            .select("*")
            .order(
                "fecha_ejecucion",
                {
                    ascending: true
                }
            );


    if (error) {

        alert(
            "Error cargando permisos:\n\n" +
            error.message
        );

        return;
    }


    permisos = data || [];


    updateDashboard();

    renderCalendar();

}


/* =====================================================
   ACTUALIZAR INDICADORES
===================================================== */

function updateDashboard() {

    document.getElementById("countPlaneado")
        .textContent =
        permisos.filter(
            p => p.estado === "PLANEADO"
        ).length;


    document.getElementById("countSolicitado")
        .textContent =
        permisos.filter(
            p => p.estado === "SOLICITADO"
        ).length;


    document.getElementById("countAprobado")
        .textContent =
        permisos.filter(
            p => p.estado === "APROBADO"
        ).length;


    document.getElementById("countEjecutado")
        .textContent =
        permisos.filter(
            p => p.estado === "EJECUTADO"
        ).length;

}


/* =====================================================
   CALENDARIO
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");


    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const monthName =
        currentDate.toLocaleDateString(
            "es-CO",
            {
                month: "long",
                year: "numeric"
            }
        );


    document.getElementById("monthTitle")
        .textContent =
        monthName;


    const weekdays = [

        "LUN",
        "MAR",
        "MIÉ",
        "JUE",
        "VIE",
        "SÁB",
        "DOM"

    ];


    weekdays.forEach(day => {

        const header =
            document.createElement("div");

        header.className = "weekday";

        header.textContent = day;

        calendar.appendChild(header);

    });


    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    // Convertir domingo = 0
    // a lunes = 0

    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className = "day";

        calendar.appendChild(empty);

    }


    for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
    ) {

        const day =
            document.createElement("div");

        day.className = "day";


        const dateString =
            formatDate(
                new Date(
                    year,
                    month,
                    dayNumber
                )
            );


        const today =
            formatDate(
                new Date()
            );


        if (dateString === today) {

            day.classList.add("today");

        }


        const number =
            document.createElement("div");

        number.className =
            "day-number";

        number.textContent =
            dayNumber;


        day.appendChild(number);


        const events =
            getFilteredPermissions()
                .filter(
                    p =>
                        p.fecha_ejecucion ===
                        dateString
                );


        events.forEach(permission => {

            const event =
                document.createElement("div");


            event.className =
                "event estado-" +
                permission.estado;


            event.innerHTML =

                "<strong>PO " +

                escapeHtml(
                    permission.numero_po || ""
                ) +

                "</strong><br>" +

                escapeHtml(
                    permission.actividad || ""
                );


            event.title =
                "Haz clic para editar";


            event.onclick = () => {

                openEditPermission(
                    permission
                );

            };


            day.appendChild(event);

        });


        calendar.appendChild(day);

    }

}


/* =====================================================
   FILTROS
===================================================== */

function getFilteredPermissions() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const estado =
        document.getElementById(
            "filterEstado"
        ).value;


    return permisos.filter(permission => {

        const text = [

            permission.numero_po,

            permission.actividad,

            permission.municipio,

            permission.zona,

            permission.alimentador,

            permission.cto,

            permission.responsable,

            permission.contratista,

            permission.planeador

        ]
        .join(" ")
        .toLowerCase();


        const matchesSearch =
            !search ||
            text.includes(search);


        const matchesEstado =
            !estado ||
            permission.estado === estado;


        return (
            matchesSearch &&
            matchesEstado
        );

    });

}

/* =====================================================
   GUARDAR PERMISO
===================================================== */

async function savePermission() {

    const data = {

        numero_po:
            getValue("numero_po"),

        actividad:
            getValue("actividad"),

        fecha_ejecucion:
            getValue("fecha_ejecucion") || null,

        hora_inicio:
            getValue("hora_inicio") || null,

        hora_fin:
            getValue("hora_fin") || null,

        municipio:
            getValue("municipio"),

        zona:
            getValue("zona"),

        alimentador:
            getValue("alimentador"),

        cto:
            getValue("cto"),

        responsable:
            getValue("responsable"),

        contratista:
            getValue("contratista"),

        planeador:
            getValue("planeador"),

        estado:
            getValue("estado"),

        fecha_solicitud:
            getValue("fecha_solicitud") || null,

        fecha_aprobacion:
            getValue("fecha_aprobacion") || null,

        fecha_ejecucion_real:
            getValue("fecha_ejecucion_real") || null,

        observaciones:
            getValue("observaciones")

    };


    if (!data.actividad) {

        showFormMessage(
            "La actividad es obligatoria.",
            false
        );

        return;
    }


    let result;


    if (editingId) {

        result =
            await supabaseClient
                .from("permisos")
                .update(data)
                .eq(
                    "id",
                    editingId
                );

    } else {

        result =
            await supabaseClient
                .from("permisos")
                .insert([data]);

    }


    if (result.error) {

        showFormMessage(
            "Error guardando el permiso: " +
            result.error.message,
            false
        );

        return;
    }


    showFormMessage(
        editingId
            ? "Permiso actualizado correctamente."
            : "Permiso creado correctamente.",
        true
    );


    await loadPermissions();


    setTimeout(
        () => {

            closeModal();

        },
        700
    );

}

/* =====================================================
   NAVEGACIÓN CALENDARIO
===================================================== */

function previousMonth() {

    currentDate.setMonth(
        currentDate.getMonth() - 1
    );

    renderCalendar();

}


function nextMonth() {

    currentDate.setMonth(
        currentDate.getMonth() + 1
    );

    renderCalendar();

}


function goToday() {

    currentDate =
        new Date();

    renderCalendar();

}


/* =====================================================
   FUNCIONES AUXILIARES
===================================================== */

function getValue(id) {

    return document
        .getElementById(id)
        .value
        .trim();

}


function setValue(
    id,
    value
) {

    const element =
        document.getElementById(id);


    if (element) {

        element.value =
            value || "";

    }

}


function formatDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;

}


function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* =====================================================
   COMPROBAR SESIÓN
===================================================== */

async function checkSession() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        showApplication(
            data.session.user
        );

    }

}
