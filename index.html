<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Permisos Operativos Regional Aguachica</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Ebrima,Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a
    );
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.login-logo{
    text-align:center;
    font-size:52px;
    margin-bottom:10px;
}

.login-card h1{
    text-align:center;
    margin:0;
    font-size:24px;
}

.login-card p{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

/* =====================================================
   APLICACIÓN
===================================================== */

#app{
    display:none;
}

.topbar{
    min-height:70px;
    background:#0f172a;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 25px;
    position:sticky;
    top:0;
    z-index:100;
}

.topbar-title{
    font-size:20px;
    font-weight:bold;
}

.topbar-user{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:14px;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:25px;
}

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-left:5px solid;
}

.stat-card h3{
    margin:0;
    font-size:14px;
    color:#64748b;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    margin-top:8px;
}

.stat-planeado{
    border-color:#2196f3;
}

.stat-solicitado{
    border-color:#eab308;
}

.stat-aprobado{
    border-color:#9333ea;
}

.stat-ejecutado{
    border-color:#16a34a;
}

/* =====================================================
   BARRA DE HERRAMIENTAS
===================================================== */

.toolbar{
    background:#fff;
    border-radius:12px;
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.toolbar input,
.toolbar select{
    flex:1;
    min-width:200px;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:14px;
    background:#fff;
}

textarea{
    min-height:90px;
    resize:vertical;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    font-size:13px;
}

.form-group{
    margin-bottom:15px;
}

button{
    cursor:pointer;
}

.btn-primary,
.btn-secondary,
.btn-danger,
.btn-logout{
    border:none;
    padding:11px 18px;
    border-radius:8px;
    font-weight:bold;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-secondary{
    background:#64748b;
    color:#fff;
}

.btn-danger{
    background:#dc2626;
    color:#fff;
}

.btn-danger:hover{
    background:#b91c1c;
}

.btn-logout{
    background:#334155;
    color:#fff;
    padding:9px 15px;
}

/* =====================================================
   CALENDARIO
===================================================== */

.calendar-card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.calendar-header h2{
    margin:0;
    text-transform:capitalize;
}

.calendar-buttons{
    display:flex;
    gap:6px;
}

.calendar-buttons button{
    border:none;
    background:#e2e8f0;
    padding:8px 12px;
    border-radius:7px;
    font-weight:bold;
}

.calendar-wrapper{
    overflow-x:auto;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,minmax(120px,1fr));
    border-top:1px solid #e2e8f0;
    border-left:1px solid #e2e8f0;

}

.weekday{
    background:#f8fafc;
    font-weight:bold;
    text-align:center;
    padding:10px 5px;
    border-right:1px solid #e2e8f0;
    border-bottom:1px solid #e2e8f0;
}

.day{

    padding:6px;

    border-bottom:1px solid #e2e8f0;

}

.day-number{

    font-size:13px;
    margin-bottom:5px;
}

.today{
    background:#eff6ff;
}

.holiday-day{
    background:#fff7ed!important;
}

.holiday-name{
    background:#f97316;
    color:#fff;
    padding:4px 6px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:5px;
}

.event{
    color:#fff;
    padding:5px 7px;
    border-radius:5px;

}

.event:hover{

}

.estado-PLANEADO{

}

.estado-SOLICITADO{

}

.estado-APROBADO{
    background:#9333ea;
}

.estado-EJECUTADO{
    background:#16a34a;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.65);
    z-index:1000;
    padding:20px;
    overflow-y:auto;
}

.modal-content{
    max-width:850px;
    margin:30px auto;
    background:#fff;
    border-radius:15px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    margin:0;
}

.close{
    border:none;
    background:#e2e8f0;
    width:35px;
    height:35px;
    border-radius:50%;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.full{
    grid-column:1/-1;
}

.modal-actions{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
}

.modal-actions-right{
    display:flex;
    gap:10px;
}

/* =====================================================
   MENSAJES
===================================================== */

.message{
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    display:none;
    white-space:pre-line;
}

.message-error{
    background:#fee2e2;
    color:#991b1b;
}

.message-success{
    background:#dcfce7;
    color:#166534;
}

.loading{
    opacity:.6;
    pointer-events:none;
}

/* =====================================================
   LEYENDA
===================================================== */

.legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:15px;
    font-size:12px;
}

.legend-item{
    display:flex;
    align-items:center;

}

.legend-color{

    height:14px;

.legend-holiday{

/* =====================================================

===================================================== */

@media(max-width:900px){

@media(max-width:650px){

    }

    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .modal-actions,
    .modal-actions-right{
        flex-direction:column;
    }

    .calendar{
        min-width:750px;
    }

}

</style>

<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lhdbpwaxzthumsflvmkm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_86bRK3rezZLTS7B7AVOv-g_hlT_XAiE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let permisos = [];

let currentDate = new Date();

let editingId = null;

let saving = false;


/* =====================================================
   AUTENTICACIÓN
===================================================== */

async function login(){

    const email =
        getValue("loginEmail");

    const password =
        document.getElementById("loginPassword").value;


    if(!email || !password){

        showLoginMessage(
            "Ingrese correo y contraseña."
        );

        return;
    }


    const button =
        document.querySelector(
            '#loginScreen .btn-primary'
        );


    if(button){

        button.disabled = true;

        button.textContent =
            "⏳ Ingresando...";

    }


    try{

        const result =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        const data = result.data;

        const error = result.error;


        if(error){

            showLoginMessage(
                "No fue posible iniciar sesión:\n\n" +
                error.message
            );

            return;
        }


        if(!data || !data.user){

            showLoginMessage(
                "Supabase no devolvió el usuario."
            );

            return;
        }


        showApplication(
            data.user
        );


    }catch(error){

        console.error(
            "ERROR LOGIN:",
            error
        );


        showLoginMessage(
            "Error de conexión con Supabase:\n\n" +
            error.message
        );


    }finally{

        if(button){

            button.disabled = false;

            button.textContent =
                "🔐 Ingresar";

        }

    }

}


function showApplication(user){

    document.getElementById(
        "loginScreen"
    ).style.display = "none";


    document.getElementById(
        "app"
    ).style.display = "block";


    document.getElementById(
        "currentUser"
    ).textContent =
        user?.email || "Usuario";


    loadPermissions();

}


async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


function showLoginMessage(message){

    const box =
        document.getElementById(
            "loginMessage"
        );


    box.textContent = message;

    box.style.display = "block";

}


/* =====================================================
   CARGAR PERMISOS
===================================================== */

async function loadPermissions(){

    try{

        const result =
            await supabaseClient
                .from("permisos")
                .select("*")
                .order(
                    "fecha_ejecucion",
                    {
                        ascending:true
                    }
                );


        const data = result.data;

        const error = result.error;


        if(error){

            console.error(
                "ERROR CARGANDO PERMISOS:",
                error
            );


            alert(
                "Error cargando permisos:\n\n" +
                error.message
            );

            return;
        }


        permisos =
            data || [];


        updateDashboard();

        renderCalendar();


    }catch(error){

        console.error(
            "ERROR:",
            error
        );

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

    const estados = [
        "PLANEADO",
        "SOLICITADO",
        "APROBADO",
        "EJECUTADO"
    ];


    estados.forEach(
        estado => {

            const id =
                "count" +
                estado.charAt(0) +
                estado.slice(1).toLowerCase();


            const cantidad =
                permisos.filter(
                    p =>
                        String(
                            p.estado || ""
                        ).toUpperCase()
                        === estado
                ).length;


            const element =
                document.getElementById(id);


            if(element){

                element.textContent =
                    cantidad;

            }

        }
    );

}


/* =====================================================
   FESTIVOS COLOMBIA
===================================================== */

function calcularPascua(year){

    const a = year % 19;

    const b =
        Math.floor(year / 100);

    const c =
        year % 100;

    const d =
        Math.floor(b / 4);

    const e =
        b % 4;

    const f =
        Math.floor(
            (b + 8) / 25
        );

    const g =
        Math.floor(
            (b - f + 1) / 3
        );

    const h =
        (
            19*a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(c / 4);

    const k =
        c % 4;

    const l =
        (
            32 +
            2*e +
            2*i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (a + 11*h + 22*l) /
            451
        );

    const month =
        Math.floor(
            (h + l - 7*m + 114) /
            31
        );

    const day =
        (
            (h + l - 7*m + 114) %
            31
        ) + 1;


    return new Date(
        year,
        month - 1,
        day
    );

}


function siguienteLunes(date){

    const d =
        new Date(date);


    const day =
        d.getDay();


    if(day === 0){

        d.setDate(
            d.getDate() + 1
        );

    }else if(day !== 1){

        d.setDate(
            d.getDate() +
            (8 - day)
        );

    }


    return d;

}


function getColombianHolidays(year){

    const h = {};


    const add =
        (date,name) => {

            h[
                formatDate(date)
            ] = name;

        };


    const fixedMonday =
        (month,day,name) => {

            add(
                siguienteLunes(
                    new Date(
                        year,
                        month - 1,
                        day
                    )
                ),
                name
            );

        };


    /* FESTIVOS FIJOS */

    add(
        new Date(year,0,1),
        "Año Nuevo"
    );

    add(
        new Date(year,4,1),
        "Día del Trabajo"
    );

    add(
        new Date(year,6,20),
        "Independencia de Colombia"
    );

    add(
        new Date(year,7,7),
        "Batalla de Boyacá"
    );

    add(
        new Date(year,11,8),
        "Inmaculada Concepción"
    );

    add(
        new Date(year,11,25),
        "Navidad"
    );


    /* FESTIVOS QUE SE TRASLADAN AL LUNES */

    fixedMonday(
        1,
        6,
        "Día de los Reyes Magos"
    );

    fixedMonday(
        3,
        19,
        "Día de San José"
    );

    fixedMonday(
        6,
        29,
        "San Pedro y San Pablo"
    );

    fixedMonday(
        8,
        15,
        "Asunción de la Virgen"
    );

    fixedMonday(
        10,
        12,
        "Día de la Raza"
    );

    fixedMonday(
        11,
        1,
        "Todos los Santos"
    );

    fixedMonday(
        11,
        11,
        "Independencia de Cartagena"
    );


    /* SEMANA SANTA */

    const easter =
        calcularPascua(year);


    const jueves =
        new Date(easter);

    jueves.setDate(
        jueves.getDate() - 3
    );

    add(
        jueves,
        "Jueves Santo"
    );


    const viernes =
        new Date(easter);

    viernes.setDate(
        viernes.getDate() - 2
    );

    add(
        viernes,
        "Viernes Santo"
    );


    /* ASCENSIÓN */

    const asc =
        new Date(easter);

    asc.setDate(
        asc.getDate() + 43
    );

    add(
        siguienteLunes(asc),
        "Ascensión del Señor"
    );


    /* CORPUS CHRISTI */

    const corpus =
        new Date(easter);

    corpus.setDate(
        corpus.getDate() + 64
    );

    add(
        siguienteLunes(corpus),
        "Corpus Christi"
    );


    /* SAGRADO CORAZÓN */

    const sc =
        new Date(easter);

    sc.setDate(
        sc.getDate() + 71
    );

    add(
        siguienteLunes(sc),
        "Sagrado Corazón de Jesús"
    );


    return h;

}


/* =====================================================
   CALENDARIO
===================================================== */

function renderCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );


    if(!calendar){

        return;

    }


    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =
        currentDate.toLocaleDateString(
            "es-CO",
            {
                month:"long",
                year:"numeric"
            }
        );


    const holidays =
        getColombianHolidays(
            year
        );


    const weekdays = [
        "LUN",
        "MAR",
        "MIÉ",
        "JUE",
        "VIE",
        "SÁB",
        "DOM"
    ];


    weekdays.forEach(
        name => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "weekday";

            element.textContent =
                name;

            calendar.appendChild(
                element
            );

        }
    );


    let first =
        new Date(
            year,
            month,
            1
        ).getDay();


    first =
        first === 0
        ? 6
        : first - 1;


    for(
        let i = 0;
        i < first;
        i++
    ){

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day";

        calendar.appendChild(
            empty
        );

    }


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const today =
        formatDate(
            new Date()
        );


    for(
        let n = 1;
        n <= days;
        n++
    ){

        const d =
            new Date(
                year,
                month,
                n
            );


        const dateString =
            formatDate(d);


        const day =
            document.createElement(
                "div"
            );


        day.className =
            "day";


        if(
            dateString === today
        ){

            day.classList.add(
                "today"
            );

        }


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            n;


        day.appendChild(
            number
        );


        /* FESTIVO */

        if(
            holidays[dateString]
        ){

            day.classList.add(
                "holiday-day"
            );


            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "holiday-name";


            holiday.textContent =
                "🇨🇴 " +
                holidays[dateString];


            day.appendChild(
                holiday
            );

        }


        /* PERMISOS */

        getFilteredPermissions()
            .filter(
                p =>
                    normalizeDate(
                        p.fecha_ejecucion
                    ) === dateString
            )
            .forEach(
                p => {

                    const event =
                        document.createElement(
                            "div"
                        );


                    event.className =
                        "event estado-" +
                        String(
                            p.estado ||
                            "PLANEADO"
                        ).toUpperCase();


                    event.innerHTML =
                        "<strong>PO " +
                        escapeHtml(
                            p.numero_po || ""
                        ) +
                        "</strong><br>" +
                        escapeHtml(
                            p.actividad || ""
                        );


                    event.onclick =
                        () =>
                            openEditPermissionById(
                                p.id
                            );


                    day.appendChild(
                        event
                    );

                }
            );


        calendar.appendChild(
            day
        );

    }

}


/* =====================================================
   FILTROS
===================================================== */

function getFilteredPermissions(){

    const search =
        getValue(
            "searchInput"
        ).toLowerCase();


    const estado =
        getValue(
            "filterEstado"
        );


    return permisos.filter(
        p => {

            const text = [

                p.numero_po,
                p.actividad,
                p.municipio,
                p.zona,
                p.alimentador,
                p.cto,
                p.responsable,
                p.contratista,
                p.planeador

            ]
            .join(" ")
            .toLowerCase();


            return (

                !search ||
                text.includes(search)

            ) && (

                !estado ||
                String(
                    p.estado || ""
                ).toUpperCase()
                === estado

            );

        }
    );

}

===================================================== */

async function openEditPermissionById(id){

    const numericId =
        Number(id);


    if(
        !Number.isInteger(
            numericId
        )
    ){

        alert(
            "El ID del permiso no es válido."
        );

        return;

    }


    const result =
        await supabaseClient
            .from("permisos")
            .select("*")
            .eq(
                "id",
                numericId
            )
            .single();


    const data =
        result.data;

    const error =
        result.error;


    if(
        error ||
        !data
    ){

        alert(
            "No fue posible cargar el permiso seleccionado:\n\n" +
            (
                error?.message ||
                "Registro no encontrado"
            )
        );

        return;

    }


    editingId =
        numericId;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Editar permiso operativo";


    setValue(
        "permissionId",
        numericId
    );


    const fields = [

        "numero_po",
        "actividad",
        "fecha_ejecucion",
        "hora_inicio",
        "hora_fin",
        "municipio",
        "zona",
        "alimentador",
        "cto",
        "responsable",
        "contratista",
        "planeador",
        "estado",
        "fecha_solicitud",
        "fecha_aprobacion",
        "fecha_ejecucion_real",
        "observaciones"

    ];


    fields.forEach(
        field => {

            setValue(
                field,
                data[field]
            );

        }
    );


    document.getElementById(
        "btnEliminar"
    ).style.display =
        "inline-block";


    document.getElementById(
        "permissionModal"
    ).style.display =
        "block";

}


/* =====================================================
   GUARDAR PERMISO
===================================================== */

async function savePermission(){

    if(saving){

        return;

    }


    const data = {

        numero_po:
            getValue("numero_po"),

        actividad:
            getValue("actividad"),

        fecha_ejecucion:
            getValue("fecha_ejecucion")
            || null,

        hora_inicio:
            getValue("hora_inicio")
            || null,

        hora_fin:
            getValue("hora_fin")
            || null,

        municipio:
            getValue("municipio"),

        zona:
            getValue("zona"),

        alimentador:
            getValue("alimentador"),

        cto:
            getValue("cto"),

        responsable:
            getValue("responsable"),

        contratista:
            getValue("contratista"),

        planeador:
            getValue("planeador"),

        estado:
            getValue("estado"),

        fecha_solicitud:
            getValue("fecha_solicitud")
            || null,

        fecha_aprobacion:
            getValue("fecha_aprobacion")
            || null,

        fecha_ejecucion_real:
            getValue("fecha_ejecucion_real")
            || null,

        observaciones:
            getValue("observaciones")

    };


    if(!data.actividad){

        showFormMessage(
            "La actividad es obligatoria.",
            false
        );

        return;

    }


    saving = true;


    document.getElementById(
        "btnGuardar"
    ).classList.add(
        "loading"
    );


    try{


        /* =================================================
           EDITAR
        ================================================= */

        if(
            editingId !== null
        ){

            const id =
                Number(
                    editingId
                );


            if(
                !Number.isInteger(id)
            ){

                throw new Error(
                    "El ID del permiso no es válido."
                );

            }


            /*
             IMPORTANTE:

             SOLO se utiliza el ID del registro.

             Esto evita que modificar CTO,
             actividad, descripción, etc.
             modifique otros permisos.
            */

            const result =
                await supabaseClient
                    .from("permisos")
                    .update(data)
                    .eq(
                        "id",
                        id
                    )
                    .select("*");


            const updated =
                result.data;

            const error =
                result.error;


            if(error){

                throw error;

            }


            if(
                !updated ||
                updated.length !== 1 ||
                Number(
                    updated[0].id
                ) !== id
            ){

                throw new Error(
                    "La actualización no afectó exactamente al permiso seleccionado."
                );

            }


            alert(
                "✅ Permiso PO " +
                (
                    data.numero_po ||
                    id
                ) +
                " actualizado correctamente."
            );

        }


        /* =================================================
           CREAR
        ================================================= */

        else{

            const result =
                await supabaseClient
                    .from("permisos")
                    .insert(
                        [data]
                    )
                    .select("*");


            const inserted =
                result.data;

            const error =
                result.error;


            if(error){

                throw error;

            }


            if(
                !inserted ||
                inserted.length !== 1
            ){

                throw new Error(
                    "No fue posible confirmar la creación del permiso."
                );

            }


            alert(
                "✅ Permiso creado correctamente."
            );

        }


        closeModal();


        await loadPermissions();


    }catch(error){

        console.error(
            "ERROR GUARDANDO:",
            error
        );


        showFormMessage(
            "No fue posible guardar el permiso.\n\n" +
            error.message,
            false
        );


    }finally{

        saving = false;


        document.getElementById(
            "btnGuardar"
        ).classList.remove(
            "loading"
        );

    }

}


/* =====================================================
   ELIMINAR PERMISO
===================================================== */

async function deletePermission(){

    if(
        editingId === null
    ){

        return;

    }


    const id =
        Number(
            editingId
        );


    const p =
        permisos.find(
            x =>
                Number(x.id) === id
        );


    if(!p){

        alert(
            "No se encontró el permiso seleccionado."
        );

        return;

    }


    const confirmar =
        confirm(

            "¿Está seguro de eliminar el permiso PO " +
            (
                p.numero_po ||
                id
            ) +
            "?\n\n" +

            "Actividad: " +
            (
                p.actividad ||
                "Sin descripción"
            ) +

            "\n\nEsta acción no se puede deshacer."

        );


    if(!confirmar){

        return;

    }


    try{


        const result =
            await supabaseClient
                .from("permisos")
                .delete()
                .eq(
                    "id",
                    id
                )
                .select("*");


        const data =
            result.data;

        const error =
            result.error;


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length !== 1 ||
            Number(
                data[0].id
            ) !== id
        ){

            showFormMessage(

                "El permiso NO fue eliminado.\n\n" +
                "Supabase no confirmó una fila eliminada. " +
                "Revise la política RLS de DELETE.",

                false

            );

            return;

        }


        /*
         Eliminación local inmediata
         */

        permisos =
            permisos.filter(
                x =>
                    Number(x.id) !== id
            );


        editingId =
            null;


        updateDashboard();

        renderCalendar();

        closeModal();


        alert(
            "✅ El permiso PO " +
            (
                p.numero_po ||
                id
            ) +
            " fue eliminado correctamente."
        );


        await loadPermissions();


    }catch(error){

        console.error(
            "ERROR ELIMINANDO:",
            error
        );


        showFormMessage(

            "No fue posible eliminar el permiso.\n\n" +
            error.message,

            false

        );

    }

}

/* =====================================================
   UTILIDADES
===================================================== */

function getValue(id){

    const element =
        document.getElementById(id);


    return element
        ? (
            element.value || ""
        ).trim()
        : "";

}


function setValue(
    id,
    value
){

    const element =
        document.getElementById(id);


    if(element){

        element.value =
            value ?? "";

    }

}


function formatDate(d){

    return (

        d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2,"0")

    );

}


function normalizeDate(v){

    if(!v){

        return "";

    }


    return String(v).slice(
        0,
        10
    );

}


function escapeHtml(v){

    return String(
        v ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}
