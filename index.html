<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seguimiento Permisos Operativos Regional Aguachica</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Ebrima, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

/* =========================
   LOGIN
========================= */

#loginScreen {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background: linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a
    );

    padding: 20px;
}

.login-card {

    width: 100%;

    max-width: 420px;

    background: white;

    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);
}

.login-logo {

    text-align: center;

    font-size: 52px;

    margin-bottom: 10px;
}

.login-card h1 {

    text-align: center;

    margin: 0;

    font-size: 24px;
}

.login-card p {

    text-align: center;

    color: #64748b;

    margin-bottom: 30px;
}


/* =========================
   APLICACIÓN
========================= */

#app {
    display: none;
}

.topbar {

    min-height: 70px;

    background: #0f172a;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 25px;

    position: sticky;

    top: 0;

    z-index: 100;
}

.topbar-title {

    font-size: 20px;

    font-weight: bold;
}

.topbar-user {

    display: flex;

    align-items: center;

    gap: 15px;

    font-size: 14px;
}

.btn-logout {

    color: white;

    border: none;

    padding: 9px 15px;

    border-radius: 8px;

}

.btn-logout:hover {

}

.container {

    max-width: 1500px;

    margin: auto;

    padding: 25px;
}


/* =========================
   INDICADORES
========================= */

.dashboard {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 20px;
}

.stat-card {

    background: white;

    border-radius: 12px;

    padding: 18px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);

    border-left: 5px solid;
}

.stat-card h3 {

    margin: 0;

    font-size: 14px;

}

.stat-number {

    font-size: 30px;

    font-weight: bold;

    margin-top: 8px;
}

.stat-planeado {
    border-color: #2196f3;
}

.stat-solicitado {
    border-color: #eab308;
}

.stat-aprobado {
    border-color: #9333ea;
}

.stat-ejecutado {

}

.toolbar input,

}


/* =========================
   CAMPOS
========================= */

input,
select,
textarea {

    width: 100%;

    padding: 11px;

    border:
        1px solid #cbd5e1;

    border-radius: 8px;

    font-size: 14px;

    background: white;
}

textarea {

    min-height: 90px;

}

label {

    display: block;

    font-weight: bold;

    margin-bottom: 6px;

    font-size: 13px;
}

.form-group {
    margin-bottom: 15px;
}

button {
    cursor: pointer;
}

.btn-primary {

    color: white;

    border: none;

    padding: 11px 18px;

    border-radius: 8px;

    font-weight: bold;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {

    background: #64748b;

    color: white;

    padding: 11px 18px;

    border-radius: 8px;
}

.btn-danger {

    background: #dc2626;

    color: white;

    border: none;

    padding: 11px 18px;

    border-radius: 8px;

    font-weight: bold;
}

.btn-danger:hover {
    background: #b91c1c;

/* =========================
   CALENDARIO
========================= */

.calendar-card {

.calendar-header {

/* =========================

/* =========================

/* =========================

========================= */

.modal {

    inset: 0;

    background:

    z-index: 1000;

.modal-content {

.modal-header {

    margin-bottom: 20px;

.modal-header h2 {

.close {

    border: none;

.form-grid {

.full {

.modal-actions {

/* =========================

}

/* =========================

========================= */

.legend-item {

    }

    }

}

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lhdbpwaxzthumsflvmkm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_86bRK3rezZLTS7B7AVOv-g_hlT_XAiE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let permisos = [];

let currentDate = new Date();

let editingId = null;


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!email || !password) {

        showLoginMessage(
            "Ingrese correo y contraseña."
        );

        return;
    }


    try {

        const {
            data,
            error
        } = await supabaseClient
            .auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            showLoginMessage(
                "No fue posible iniciar sesión: " +
                error.message
            );

            return;
        }


        showApplication(
            data.user
        );


    } catch (error) {

        showLoginMessage(
            "Error de conexión con Supabase: " +
            error.message
        );

    }

}


/* =====================================================
   MOSTRAR APP
===================================================== */

function showApplication(user) {

    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("app")
        .style.display = "block";


    document
        .getElementById("currentUser")
        .textContent =
        user.email;


    loadPermissions();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    await supabaseClient
        .auth
        .signOut();

    location.reload();

}


/* =====================================================
   MENSAJE LOGIN
===================================================== */

function showLoginMessage(message) {

    const box =
        document.getElementById(
            "loginMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";

}


/* =====================================================
   CARGAR PERMISOS
===================================================== */

async function loadPermissions() {

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("permisos")
            .select("*")
            .order(
                "fecha_ejecucion",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Error cargando permisos:",
                error
            );

            alert(
                "Error cargando permisos:\n\n" +
                error.message
            );

            return;
        }


        permisos = data || [];


        updateDashboard();

        renderCalendar();


        console.log(
            "Permisos cargados:",
            permisos.length
        );


    } catch (error) {

        console.error(
            "Error inesperado cargando permisos:",
            error
        );

    }

}


/* =====================================================
   INDICADORES
===================================================== */

function updateDashboard() {

    document
        .getElementById("countPlaneado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "PLANEADO"
        ).length;


    document
        .getElementById("countSolicitado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "SOLICITADO"
        ).length;


    document
        .getElementById("countAprobado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "APROBADO"
        ).length;


    document
        .getElementById("countEjecutado")
        .textContent =
        permisos.filter(
            p =>
                p.estado === "EJECUTADO"
        ).length;

}


/* =====================================================
   PASCUA
===================================================== */

function calcularPascua(year) {

    const a = year % 19;

    const b = Math.floor(
        year / 100
    );

    const c = year % 100;

    const d = Math.floor(
        b / 4
    );

    const e = b % 4;

    const f = Math.floor(
        (b + 8) / 25
    );

    const g = Math.floor(
        (b - f + 1) / 3
    );

    const h =
        (
            19 * a +
            b -
            d -
            g +
            15
        ) % 30;

    const i =
        Math.floor(
            c / 4
        );

    const k = c % 4;

    const l =
        (
            32 +
            2 * e +
            2 * i -
            h -
            k
        ) % 7;

    const m =
        Math.floor(
            (
                a +
                11 * h +
                22 * l
            ) / 451
        );

    const month =
        Math.floor(
            (
                h +
                l -
                7 * m +
                114
            ) / 31
        );

    const day =
        (
            (
                h +
                l -
                7 * m +
                114
            ) % 31
        ) + 1;


    return new Date(
        year,
        month - 1,
        day
    );

}


/* =====================================================
   SIGUIENTE LUNES
===================================================== */

function siguienteLunes(date) {

    const result =
        new Date(date);

    const day =
        result.getDay();


    if (day === 0) {

        result.setDate(
            result.getDate() + 1
        );

    }
    else if (day !== 1) {

        result.setDate(
            result.getDate() +
            (8 - day)
        );

    }


    return result;

}


/* =====================================================
   FESTIVOS COLOMBIA
===================================================== */

function getColombianHolidays(year) {

    const holidays = {};


    function add(date, name) {

        holidays[
            formatDate(date)
        ] = name;

    }


    function fixed(
        month,
        day,
        name
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );


        if (
            date.getDay() === 1
        ) {

            add(
                date,
                name
            );

        }
        else {

            add(
                siguienteLunes(date),
                name
            );

        }

    }


    /* Festivos fijos */

    add(
        new Date(year, 0, 1),
        "Año Nuevo"
    );


    add(
        new Date(year, 4, 1),
        "Día del Trabajo"
    );


    add(
        new Date(year, 6, 20),
        "Independencia de Colombia"
    );


    add(
        new Date(year, 7, 7),
        "Batalla de Boyacá"
    );


    add(
        new Date(year, 11, 8),
        "Inmaculada Concepción"
    );


    add(
        new Date(year, 11, 25),
        "Navidad"
    );


    /* Festivos Ley Emiliani */

    fixed(
        1,
        6,
        "Día de los Reyes Magos"
    );


    fixed(
        3,
        19,
        "Día de San José"
    );


    fixed(
        6,
        29,
        "San Pedro y San Pablo"
    );


    fixed(
        8,
        15,
        "Asunción de la Virgen"
    );


    fixed(
        10,
        12,
        "Día de la Raza"
    );


    fixed(
        11,
        1,
        "Todos los Santos"
    );


    fixed(
        11,
        11,
        "Independencia de Cartagena"
    );


    /* Semana Santa */

    const easter =
        calcularPascua(year);


    const juevesSanto =
        new Date(easter);

    juevesSanto.setDate(
        easter.getDate() - 3
    );


    const viernesSanto =
        new Date(easter);

    viernesSanto.setDate(
        easter.getDate() - 2
    );


    add(
        juevesSanto,
        "Jueves Santo"
    );


    add(
        viernesSanto,
        "Viernes Santo"
    );


    /* Ascensión */

    const ascension =
        new Date(easter);

    ascension.setDate(
        easter.getDate() + 43
    );


    add(
        siguienteLunes(ascension),
        "Ascensión del Señor"
    );


    /* Corpus Christi */

    const corpus =
        new Date(easter);

    corpus.setDate(
        easter.getDate() + 64
    );


    add(
        siguienteLunes(corpus),
        "Corpus Christi"
    );


    /* Sagrado Corazón */

    const sagradoCorazon =
        new Date(easter);

    sagradoCorazon.setDate(
        easter.getDate() + 71
    );


    add(
        siguienteLunes(
            sagradoCorazon
        ),
        "Sagrado Corazón de Jesús"
    );


    return holidays;

}


/* =====================================================
   CALENDARIO
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    document
        .getElementById(
            "monthTitle"
        )
        .textContent =
        currentDate.toLocaleDateString(
            "es-CO",
            {
                month: "long",
                year: "numeric"
            }
        );


    const holidays =
        getColombianHolidays(
            year
        );


    const weekdays = [

        "LUN",
        "MAR",
        "MIÉ",
        "JUE",
        "VIE",
        "SÁB",
        "DOM"

    ];


    weekdays.forEach(
        name => {

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "weekday";

            header.textContent =
                name;

            calendar.appendChild(
                header
            );

        }
    );


    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* Espacios */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day";

        calendar.appendChild(
            empty
        );

    }


    /* Días */

    for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
    ) {


        const day =
            document.createElement(
                "div"
            );


        day.className =
            "day";


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const dateString =
            formatDate(date);


        const today =
            formatDate(
                new Date()
            );


        if (
            dateString === today
        ) {

            day.classList.add(
                "today"
            );

        }


        /* Número */

        const number =
            document.createElement(
                "div"
            );

        number.className =
            "day-number";

        number.textContent =
            dayNumber;

        day.appendChild(
            number
        );


        /* Festivo */

        if (
            holidays[dateString]
        ) {

            day.classList.add(
                "holiday-day"
            );


            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "holiday-name";


            holiday.textContent =
                "🇨🇴 " +
                holidays[dateString];


            day.appendChild(
                holiday
            );

        }


        /* Permisos */

        const events =
            getFilteredPermissions()
                .filter(
                    permission =>
                        permission
                            .fecha_ejecucion ===
                        dateString
                );


        events.forEach(
            permission => {

                const event =
                    document.createElement(
                        "div"
                    );


                event.className =
                    "event estado-" +
                    permission.estado;


                event.innerHTML =

                    "<strong>PO " +
                    escapeHtml(
                        permission.numero_po || ""
                    ) +
                    "</strong><br>" +

                    escapeHtml(
                        permission.actividad || ""
                    );


                event.onclick =
                    () => {

                        openEditPermission(
                            permission
                        );

                    };


                day.appendChild(
                    event
                );

            }
        );


        calendar.appendChild(
            day
        );

    }

}


/* =====================================================
   FILTROS
===================================================== */

function getFilteredPermissions() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const estado =
        document
            .getElementById(
                "filterEstado"
            )
            .value;


    return permisos.filter(
        permission => {


            const text = [

                permission.numero_po,

                permission.actividad,

                permission.municipio,

                permission.zona,

                permission.alimentador,

                permission.cto,

                permission.responsable,

                permission.contratista,

                permission.planeador

            ]
            .join(" ")
            .toLowerCase();


            return (

                (!search ||
                text.includes(search))

                &&

                (!estado ||
                permission.estado === estado)

            );

        }
    );

}

/* =====================================================
   GUARDAR
===================================================== */

async function savePermission() {

    const data = {

        numero_po:
            getValue("numero_po"),

        actividad:
            getValue("actividad"),

        fecha_ejecucion:
            getValue("fecha_ejecucion")
            || null,

        hora_inicio:
            getValue("hora_inicio")
            || null,

        hora_fin:
            getValue("hora_fin")
            || null,

        municipio:
            getValue("municipio"),

        zona:
            getValue("zona"),

        alimentador:
            getValue("alimentador"),

        cto:
            getValue("cto"),

        responsable:
            getValue("responsable"),

        contratista:
            getValue("contratista"),

        planeador:
            getValue("planeador"),

        estado:
            getValue("estado"),

        fecha_solicitud:
            getValue("fecha_solicitud")
            || null,

        fecha_aprobacion:
            getValue("fecha_aprobacion")
            || null,

        fecha_ejecucion_real:
            getValue("fecha_ejecucion_real")
            || null,

        observaciones:
            getValue("observaciones")

    };


    if (!data.actividad) {

        showFormMessage(
            "La actividad es obligatoria.",
            false
        );

        return;
    }


    let result;


    if (editingId) {

        result =
            await supabaseClient
                .from("permisos")
                .update(data)
                .eq(
                    "id",
                    editingId
                );

    }
    else {

        result =
            await supabaseClient
                .from("permisos")
                .insert([
                    data
                ]);

    }


    if (result.error) {

        showFormMessage(
            "Error guardando el permiso: " +
            result.error.message,
            false
        );

        return;
    }


    await loadPermissions();


    closeModal();


    alert(
        editingId
            ? "Permiso actualizado correctamente."
            : "Permiso creado correctamente."
    );

}


/* =====================================================
   ELIMINAR PERMISO
   FUNCIÓN CORREGIDA
===================================================== */

async function deletePermission() {


    if (!editingId) {

        return;

    }


    /*
       Buscar el permiso en memoria.
    */

    const permission =
        permisos.find(
            p =>
                String(p.id) ===
                String(editingId)
        );


    if (!permission) {

        alert(
            "No se encontró el permiso seleccionado."
        );

        return;

    }


    const numeroPO =
        permission.numero_po ||
        editingId;


    /*
       Confirmación.
    */

    const confirmar =
        confirm(

            "¿Está seguro de eliminar el permiso PO " +
            numeroPO +
            "?\n\n" +

            "Actividad: " +
            (
                permission.actividad ||
                "Sin descripción"
            ) +
            "\n\n" +

            "Fecha: " +
            (
                permission.fecha_ejecucion ||
                "Sin fecha"
            ) +
            "\n\n" +

            "Esta acción no se puede deshacer."

        );


    if (!confirmar) {

        return;

    }


    try {


        /*
           ELIMINAR DE SUPABASE

           IMPORTANTE:
           .select() permite verificar
           que realmente se eliminó
           una fila.
        */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("permisos")
                .delete()
                .eq(
                    "id",
                    editingId
                )
                .select();


        /*
           Error de Supabase.
        */

        if (error) {

            console.error(
                "ERROR DELETE:",
                error
            );


            showFormMessage(

                "No fue posible eliminar el permiso.\n\n" +

                error.message,

                false

            );


            return;

        }


        /*
           Si data está vacío,
           ninguna fila fue eliminada.
        */

        if (
            !data ||
            data.length === 0
        ) {


            console.error(
                "DELETE NO AFECTÓ FILAS",
                {
                    id:
                        editingId,

                    data:
                        data
                }
            );


            showFormMessage(

                "El permiso NO fue eliminado de la base de datos.\n\n" +

                "Supabase no devolvió ninguna fila eliminada.\n\n" +

                "Esto normalmente indica que la política RLS de DELETE no permite eliminar este registro.",

                false

            );


            return;

        }


        /*
           AQUÍ SABEMOS QUE SÍ SE ELIMINÓ.
        */

        console.log(
            "PERMISO ELIMINADO:",
            data
        );


        /*
           Eliminar inmediatamente
           de la memoria local.
        */

        permisos =
            permisos.filter(

                p =>
                    String(p.id) !==
                    String(editingId)

            );


        /*
           Actualizar indicadores.
        */

        updateDashboard();


        /*
           Actualizar calendario.
        */

        renderCalendar();


        /*
           Limpiar ID.
        */

        editingId = null;


        /*
           Cerrar ventana.
        */

        closeModal();


        /*
           Confirmación.
        */

        alert(

            "✅ El permiso PO " +
            numeroPO +
            " fue eliminado correctamente."

        );


        /*
           Volver a consultar Supabase.
        */

        await loadPermissions();


    }
    catch (error) {


        console.error(
            "ERROR INESPERADO:",
            error
        );


        showFormMessage(

            "Ocurrió un error inesperado:\n\n" +
            error.message,

            false

        );

    }

}

/* =====================================================
   AUXILIARES
===================================================== */

function getValue(id) {

    const element =
        document.getElementById(
            id
        );


    if (!element) {

        return "";

    }


    return element.value.trim();

}


function setValue(
    id,
    value
) {

    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.value =
            value || "";

    }

}


function formatDate(date) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (

        year +
        "-" +
        month +
        "-" +
        day

    );

}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   COMPROBAR SESIÓN
===================================================== */

async function checkSession() {

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (error) {

        console.error(
            "Error comprobando sesión:",
            error
        );

        return;

    }


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        showApplication(
            data.session.user
        );

    }

}

   CAMBIOS DE AUTENTICACIÓN
===================================================== */

    .onAuthStateChange(

        (
            event,
            session
        ) => {


            if (

                event ===
                "SIGNED_IN"

                &&

                session

                &&

                session.user

            ) {

                showApplication(
                    session.user
                );

            }

        }

    );


/* =====================================================
   TIEMPO REAL
===================================================== */

supabaseClient

    .channel(
        "permisos-realtime"
    )

    .on(

        "postgres_changes",

        {

            event: "*",

            schema: "public",

            table: "permisos"

        },

        () => {

            loadPermissions();

        }

    )

    .subscribe();


/* =====================================================
   INICIAR
===================================================== */

checkSession();
